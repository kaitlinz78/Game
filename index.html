<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night City: Streets</title><style>body{margin:0;background:#080d19;color:white;font:15px Arial;overflow:hidden}#hud{position:absolute;top:15px;left:15px;background:#091321cc;padding:15px;border-radius:12px}#help{position:absolute;bottom:15px;left:15px;background:#091321cc;padding:12px;border-radius:10px}button{padding:14px;background:#1f5d8c;color:white;border:1px solid #9dd8ff;border-radius:10px;font-size:19px;touch-action:none}#pad{position:absolute;bottom:70px;left:20px;display:grid;grid-template-columns:repeat(3,52px);gap:5px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#pad button:nth-child(3){grid-column:2}#pad button:nth-child(4){grid-column:3}#action{position:absolute;right:20px;bottom:80px}#error{position:absolute;top:110px;left:15px;color:#ffafaf;background:#24121b;padding:8px;display:none}</style><div id="hud"><b>NIGHT CITY: STREETS</b><p id="mission">Миссия: доехать до жёлтого маркера</p></div><div id="help">WASD — движение · мышь — камера · Shift — бег · Пробел — прыжок · E — машина</div><div id="pad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><button id="action">Сесть / выйти (E)</button><div id="error"></div><script>window.addEventListener("error",e=>{let x=document.getElementById("error");x.style.display="block";x.textContent="Ошибка загрузки игры: "+e.message});window.addEventListener("unhandledrejection",e=>{let x=document.getElementById("error");x.style.display="block";x.textContent="Ошибка: "+e.reason})</script><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color(0x080e20);s.fog=new T.Fog(0x080e20,35,140);const c=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,300),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0x98bbff,0x151625,2.5));const light=new T.DirectionalLight(0xc6d9ff,1.5);light.position.set(20,40,10);s.add(light);function b(w,h,d,col,x,y,z){let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:col}));m.position.set(x,y,z);s.add(m);return m}b(230,.1,230,0x19243a,0,-.1,0);b(16,.03,230,0x202634,0,0,0);b(230,.03,16,0x202634,0,.01,0);for(let k=-100;k<100;k+=12){b(.2,.05,5,0xffcc60,0,.07,k);b(5,.05,.2,0xffcc60,k,.07,0)}let seed=2;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let x=-100;x<=100;x+=19)for(let z=-100;z<=100;z+=19){if(Math.abs(x)<16||Math.abs(z)<16)continue;let h=10+rand()*32;b(12,h,12,0x263348,x,h/2,z);for(let j=3;j<h;j+=4){b(.12,1.3,1.5,rand()>.5?0x62baff:0xffbe75,x+6.1,j,z);b(1.5,1.3,.12,0x62baff,x,j,z+6.1)}}const p=new T.Group();const torso=b(.85,1.5,.6,0x208bdf,0,1.2,0),head=b(.6,.6,.6,0xffbd92,0,2.25,0);p.add(torso,head);torso.position.set(0,1.2,0);head.position.set(0,2.25,0);s.add(p);p.position.set(3,0,4);const car=new T.Group();let chassis=new T.Mesh(new T.BoxGeometry(2.6,.8,4.8),new T.MeshStandardMaterial({color:0xe22b58}));chassis.position.y=.8;car.add(chassis);let roof=new T.Mesh(new T.BoxGeometry(2.1,.8,2.6),new T.MeshStandardMaterial({color:0x172438}));roof.position.set(0,1.5,-.3);car.add(roof);for(let x of [-1.3,1.3])for(let z of [-1.5,1.5]){let w=new T.Mesh(new T.CylinderGeometry(.5,.5,.3,16),new T.MeshStandardMaterial({color:0x08090c}));w.rotation.z=Math.PI/2;w.position.set(x,.5,z);car.add(w)}s.add(car);car.position.set(3,0,-5);const mark=new T.Mesh(new T.CylinderGeometry(2.3,2.3,.15,32),new T.MeshBasicMaterial({color:0xffd139}));mark.position.set(0,.13,-70);s.add(mark);const beam=new T.Mesh(new T.CylinderGeometry(.12,.12,15,16),new T.MeshBasicMaterial({color:0xffd139,transparent:true,opacity:.4}));beam.position.set(0,7.5,-70);s.add(beam);let drive=false,done=false,vy=0,jump=0,yaw=0,pitch=.35;const keys={};function toggle(){if(drive){drive=false;p.visible=true;p.position.copy(car.position).add(new T.Vector3(3,0,0))}else if(p.position.distanceTo(car.position)<7){drive=true;p.visible=false}}onkeydown=e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(k==='e'&&!e.repeat)toggle();if(k===' '&&!e.repeat&&!drive&&jump===0)vy=8};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.getElementById('action').onclick=toggle;document.querySelectorAll('[data-key]').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();keys[el.dataset.key]=true};el.onpointerup=el.onpointercancel=()=>keys[el.dataset.key]=false});r.domElement.addEventListener('click',()=>{if(document.pointerLockElement!==r.domElement)r.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===r.domElement){yaw-=e.movementX*.003;pitch=T.MathUtils.clamp(pitch+e.movementY*.002,-.3,1.1)}});const clock=new T.Clock();function tick(){requestAnimationFrame(tick);let dt=Math.min(clock.getDelta(),.05),speed=(keys.shift?15:7)*dt;
if(drive){
 if(keys.a)car.rotation.y+=dt*1.8;
 if(keys.d)car.rotation.y-=dt*1.8;
 const v=(keys.w?1:0)-(keys.s?1:0);
 car.position.x-=Math.sin(car.rotation.y)*v*speed*2;
 car.position.z-=Math.cos(car.rotation.y)*v*speed*2;
 yaw=T.MathUtils.lerp(yaw,car.rotation.y,.025);
}else{
 const f=(keys.w?1:0)-(keys.s?1:0),side=(keys.d?1:0)-(keys.a?1:0),len=Math.hypot(f,side)||1;
 p.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed/len;
 p.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed/len;
 if(f||side)p.rotation.y=yaw+Math.atan2(-side,f);
 if(jump>0||vy>0){vy-=22*dt;jump=Math.max(0,jump+vy*dt);if(jump===0)vy=0}
 p.position.y=jump;
}
let t=drive?car.position:p.position;
const dist=drive?15:9,height=drive?7:4;
const target=new T.Vector3(t.x+Math.sin(yaw)*dist*Math.cos(pitch),t.y+height+Math.sin(pitch)*dist*.55,t.z+Math.cos(yaw)*dist*Math.cos(pitch));
c.position.lerp(target,.12);c.lookAt(t.x,t.y+(drive?1:1.5),t.z);
if(!done&&t.distanceTo(mark.position)<5){done=true;document.getElementById('mission').textContent='Миссия выполнена!'}r.render(s,c)}tick();onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></html>
