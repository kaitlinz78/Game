<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night City: Streets</title><style>body{margin:0;background:#080d19;color:white;font:15px Arial;overflow:hidden}#hud{position:absolute;top:15px;left:15px;background:#091321cc;padding:15px;border-radius:12px}#help{position:absolute;bottom:15px;left:15px;background:#091321cc;padding:12px;border-radius:10px}button{padding:14px;background:#1f5d8c;color:white;border:1px solid #9dd8ff;border-radius:10px;font-size:19px;touch-action:none}#pad{position:absolute;bottom:70px;left:20px;display:grid;grid-template-columns:repeat(3,52px);gap:5px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#pad button:nth-child(3){grid-column:2}#pad button:nth-child(4){grid-column:3}#action{position:absolute;right:20px;bottom:80px}#error{position:absolute;top:110px;left:15px;color:#ffafaf;background:#24121b;padding:8px;display:none}</style><div id="hud"><b>NIGHT CITY: STREETS</b><p id="mission">Миссия: доехать до жёлтого маркера</p></div><div id="help">WASD — движение · мышь — камера · Shift — бег · Пробел — прыжок · E — машина</div><div id="pad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><button id="action">Сесть / выйти (E)</button><div id="error"></div><script>window.addEventListener("error",e=>{let x=document.getElementById("error");x.style.display="block";x.textContent="Ошибка загрузки игры: "+e.message});window.addEventListener("unhandledrejection",e=>{let x=document.getElementById("error");x.style.display="block";x.textContent="Ошибка: "+e.reason})</script><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color(0x080e20);s.fog=new T.Fog(0x080e20,35,140);const c=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,300),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.domElement.tabIndex=0;document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0x98bbff,0x151625,2.5));const light=new T.DirectionalLight(0xc6d9ff,1.5);light.position.set(20,40,10);s.add(light);function b(w,h,d,col,x,y,z){let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:col}));m.position.set(x,y,z);s.add(m);return m}
// District grid: broad drivable streets, sidewalks, parks and varied buildings.
const colliders=[];let seed=42;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const pick=a=>a[Math.floor(rand()*a.length)];
function solid(w,h,d,col,x,y,z){const m=b(w,h,d,col,x,y,z);colliders.push({x,z,w,d});return m}
b(270,.12,270,0x172332,0,-.12,0);
for(let road=-96;road<=96;road+=32){
 b(14,.025,256,0x242a35,road,.015,0);
 b(256,.025,14,0x242a35,0,.018,road);
 for(let k=-124;k<125;k+=12){
  b(.18,.035,5,0xf5cc6a,road,.045,k);
  b(5,.035,.18,0xf5cc6a,k,.05,road);
 }
 for(let side of [-1,1]){
  b(2,.09,256,0x69717b,road+side*8,.05,0);
  b(256,.09,2,0x69717b,0,.05,road+side*8);
 }
}
const palettes=[0x2c4057,0x344154,0x3b3549,0x283d46,0x4a4050,0x334d60];
for(let x=-80;x<=80;x+=32)for(let z=-80;z<=80;z+=32){
 const park=rand()<.17;
 if(park){
  b(13,.13,13,0x285142,x,.1,z);
  for(let j=0;j<5;j++){const tx=x+(rand()-.5)*9,tz=z+(rand()-.5)*9;
   b(.5,3,.5,0x654b38,tx,1.6,tz);
   const crown=new T.Mesh(new T.ConeGeometry(1.9,4.5,7),new T.MeshStandardMaterial({color:pick([0x31785b,0x245e4d,0x49734e])}));crown.position.set(tx,5,tz);s.add(crown)}
 }else{
  const h=14+Math.floor(rand()*8)*4, w=12+rand()*2,d=12+rand()*2;
  solid(w,h,d,pick(palettes),x,h/2,z);
  b(w+.5,.6,d+.5,0x192333,x,h+.2,z);
  const glass=pick([0x8ddfff,0xffd28b,0x5e99bd,0xb8b4ff]);
  // Illuminated window strips on all four sides.
  for(let y=3;y<h-1;y+=3.4)for(let q=-2;q<=2;q++){
   const off=q*2.1;
   b(1.05,1.25,.08,rand()<.22?0x172438:glass,x+off,y,z+d/2+.06);
   b(1.05,1.25,.08,rand()<.22?0x172438:glass,x+off,y,z-d/2-.06);
   b(.08,1.25,1.05,rand()<.22?0x172438:glass,x+w/2+.06,y,z+off);
   b(.08,1.25,1.05,rand()<.22?0x172438:glass,x-w/2-.06,y,z+off);
  }
  if(rand()<.32){const sign=b(5,1.2,.2,pick([0x15c4ce,0xee5f91,0xf3c86a]),x,3,z+d/2+.2);sign.material.emissive=new T.Color(sign.material.color);sign.material.emissiveIntensity=.35}
 }
}
// Street lights along roads.
for(let k=-112;k<=112;k+=32)for(let road=-96;road<=96;road+=32){
 const lx=road+9,lz=k+8;
 b(.16,6,.16,0x8999aa,lx,3,lz);
 const lamp=b(1.2,.2,.65,0xffdf9a,lx,6.1,lz);
 lamp.material.emissive=new T.Color(0xffbb66);lamp.material.emissiveIntensity=.65;
}
// Crosswalk markings at the central junction.
for(let n=-5;n<=5;n++){b(1,.04,2,0xd2d8dc,n*2,.065,10);b(2,.04,1,0xd2d8dc,10,.065,n*2)}
function blocked(x,z,margin){return Math.abs(x)>126||Math.abs(z)>126||colliders.some(o=>Math.abs(x-o.x)<o.w/2+margin&&Math.abs(z-o.z)<o.d/2+margin)}
const p=new T.Group();const torso=b(.85,1.5,.6,0x208bdf,0,1.2,0),head=b(.6,.6,.6,0xffbd92,0,2.25,0);p.add(torso,head);torso.position.set(0,1.2,0);head.position.set(0,2.25,0);s.add(p);p.position.set(3,0,4);const car=new T.Group();let chassis=new T.Mesh(new T.BoxGeometry(2.6,.8,4.8),new T.MeshStandardMaterial({color:0xe22b58}));chassis.position.y=.8;car.add(chassis);let roof=new T.Mesh(new T.BoxGeometry(2.1,.8,2.6),new T.MeshStandardMaterial({color:0x172438}));roof.position.set(0,1.5,-.3);car.add(roof);for(let x of [-1.3,1.3])for(let z of [-1.5,1.5]){let w=new T.Mesh(new T.CylinderGeometry(.5,.5,.3,16),new T.MeshStandardMaterial({color:0x08090c}));w.rotation.z=Math.PI/2;w.position.set(x,.5,z);car.add(w)}s.add(car);car.position.set(3,0,-5);const mark=new T.Mesh(new T.CylinderGeometry(2.3,2.3,.15,32),new T.MeshBasicMaterial({color:0xffd139}));mark.position.set(0,.13,-70);s.add(mark);const beam=new T.Mesh(new T.CylinderGeometry(.12,.12,15,16),new T.MeshBasicMaterial({color:0xffd139,transparent:true,opacity:.4}));beam.position.set(0,7.5,-70);s.add(beam);let drive=false,done=false,vy=0,jump=0,yaw=0,pitch=.35;const keys={};function toggle(){if(drive){drive=false;p.visible=true;p.position.copy(car.position).add(new T.Vector3(3,0,0))}else if(p.position.distanceTo(car.position)<7){drive=true;p.visible=false}}const physical={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyV:'w',KeyE:'e',ShiftLeft:'shift',ShiftRight:'shift',Space:' '};const typed={'ц':'w','ф':'a','ы':'s','в':'d','м':'w','у':'e'};function control(e){return physical[e.code]||typed[e.key.toLowerCase()]||e.key.toLowerCase()}window.addEventListener('keydown',e=>{const k=control(e);if(['w','a','s','d',' ','shift','e'].includes(k))e.preventDefault();keys[k]=true;if(k==='e'&&!e.repeat)toggle();if(k===' '&&!e.repeat&&!drive&&jump===0)vy=8},true);window.addEventListener('keyup',e=>{keys[control(e)]=false},true);window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});document.getElementById('action').onclick=toggle;document.querySelectorAll('[data-key]').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();keys[el.dataset.key]=true};el.onpointerup=el.onpointercancel=()=>keys[el.dataset.key]=false});r.domElement.addEventListener('click',()=>{r.domElement.focus();if(document.pointerLockElement!==r.domElement)r.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===r.domElement){yaw-=e.movementX*.003;pitch=T.MathUtils.clamp(pitch+e.movementY*.002,-.3,1.1)}});const clock=new T.Clock();function tick(){requestAnimationFrame(tick);let dt=Math.min(clock.getDelta(),.05),speed=(keys.shift?15:7)*dt;
const oldX=(drive?car:p).position.x,oldZ=(drive?car:p).position.z;
if(drive){
 if(keys.a)car.rotation.y+=dt*1.8;
 if(keys.d)car.rotation.y-=dt*1.8;
 const v=(keys.w?1:0)-(keys.s?1:0);
 car.position.x-=Math.sin(car.rotation.y)*v*speed*2;
 car.position.z-=Math.cos(car.rotation.y)*v*speed*2;
 yaw=T.MathUtils.lerp(yaw,car.rotation.y,.025);
}else{
 const f=(keys.w?1:0)-(keys.s?1:0),side=(keys.d?1:0)-(keys.a?1:0),len=Math.hypot(f,side)||1;
 p.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed/len;
 p.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed/len;
 if(f||side)p.rotation.y=yaw+Math.atan2(-side,f);
 if(jump>0||vy>0){vy-=22*dt;jump=Math.max(0,jump+vy*dt);if(jump===0)vy=0}
 p.position.y=jump;
}
const actor=drive?car:p;if(blocked(actor.position.x,actor.position.z,drive?1.9:.45)){actor.position.x=oldX;actor.position.z=oldZ;}
let t=drive?car.position:p.position;
const dist=drive?15:9,height=drive?7:4;
const target=new T.Vector3(t.x+Math.sin(yaw)*dist*Math.cos(pitch),t.y+height+Math.sin(pitch)*dist*.55,t.z+Math.cos(yaw)*dist*Math.cos(pitch));
c.position.lerp(target,.12);c.lookAt(t.x,t.y+(drive?1:1.5),t.z);
if(!done&&t.distanceTo(mark.position)<5){done=true;document.getElementById('mission').textContent='Миссия выполнена!'}r.render(s,c)}tick();onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></html>
